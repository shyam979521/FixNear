{% extends "base.html" %}
{% block title %}Register as a Worker — FixNear{% endblock %}

{% block content %}
<section class="section-tight">
  <div class="shell" style="max-width: 640px;">

    <div class="section-head reveal is-visible" style="margin-bottom: 32px;">
      <div class="eyebrow"><span class="dot"></span> Join as a professional</div>
      <h2>Register as a Worker</h2>
      <p>List your service so nearby customers can find and book you.</p>
    </div>

    <form method="POST" class="form-shell reveal is-visible">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="field">
        <label for="name">Full name</label>
        <div class="input-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          <input type="text" id="name" name="name" placeholder="Enter worker name" required>
        </div>
      </div>

      <div class="field">
        <label for="work">Work / trade</label>
        <div class="input-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>
          <input type="text" id="work" name="work" placeholder="e.g. Painter, Plumber, Electrician" required>
        </div>
      </div>

      <div class="field-row">
        <div class="field">
          <label for="price">Price</label>
          <div class="input-wrap">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.42 4.58a5.4 5.4 0 0 0-7.65 0l-.77.78-.77-.78a5.4 5.4 0 0 0-7.65 0 5.4 5.4 0 0 0 0 7.65l8.42 8.42 8.42-8.42a5.4 5.4 0 0 0 0-7.65z"/></svg>
            <input type="text" id="price" name="price" placeholder="e.g. ₹300" required>
          </div>
        </div>
        <div class="field">
          <label for="location">Location</label>
          <div class="input-wrap">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
            <input type="text" id="location" name="location" placeholder="Enter location" required>
          </div>
        </div>
      </div>

      <div class="form-foot">
        <button type="submit" class="btn btn-accent btn-ripple btn-block">
          Register Worker
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
        </button>
      </div>
    </form>

    <div class="text-center" style="margin-top: 20px;">
      <a href="{{ url_for('workers') }}" class="btn btn-outline btn-ripple">Back to Workers</a>
    </div>

  </div>
</section>
{% endblock %}

{% extends "base.html" %}
{% block title %}Admin Login — FixNear{% endblock %}

{% block content %}
<section class="section-tight">
  <div class="shell" style="max-width: 440px;">
    <div class="form-shell reveal is-visible" style="text-align: center;">
      <div class="icon-wrap" style="width: 56px; height: 56px; border-radius: 16px; background: var(--grad-ink); color: #fff; display: flex; align-items: center; justify-content: center; margin: 0 auto 22px;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      </div>
      <div class="eyebrow"><span class="dot"></span> Restricted access</div>
      <h2>Admin Login</h2>
      <p style="margin-bottom: 26px;">Sign in with your administrator credentials to manage the platform.</p>

      <form method="POST" data-loading-submit style="text-align: left;">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="field-float">
          <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 6 12 13 2 6"/><path d="M2 6h20v12H2z"/></svg>
          <input type="email" id="email" name="email" placeholder=" " required>
          <label for="email">Admin email</label>
        </div>
        <div class="field-float">
          <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          <input type="password" id="password" name="password" placeholder=" " required>
          <label for="password">Password</label>
          <button type="button" class="password-toggle" data-password-toggle="password" aria-label="Show password">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>

        <button type="submit" class="btn btn-primary btn-ripple btn-block">
          Access Dashboard
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
        </button>
      </form>

      <p class="auth-switch">Not an admin? <a href="{{ url_for('login') }}">Log in as a customer or worker</a></p>
    </div>
  </div>
</section>
{% endblock %}

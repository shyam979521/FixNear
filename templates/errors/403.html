{% extends "base.html" %}
{% block title %}Access Denied — FixNear{% endblock %}

{% block content %}
<section class="section">
  <div class="shell">
    <div class="empty-state reveal is-visible" style="max-width: 480px; margin: 0 auto;">
      <div class="icon-wrap" style="width: 96px; height: 96px;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      </div>
      <div class="eyebrow" style="justify-content: center;"><span class="dot"></span> 403</div>
      <h3>Access denied</h3>
      <p>Your account doesn't have permission to view this page.</p>
      <div class="hero-actions" style="justify-content: center;">
        <a href="{{ url_for('home') }}" class="btn btn-accent btn-ripple">Back to Home</a>
        {% if logged_in_user %}
        <a href="{{ url_for('profile') }}" class="btn btn-outline btn-ripple">My Profile</a>
        {% else %}
        <a href="{{ url_for('login') }}" class="btn btn-outline btn-ripple">Log In</a>
        {% endif %}
      </div>
    </div>
  </div>
</section>
{% endblock %}

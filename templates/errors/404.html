{% extends "base.html" %}
{% block title %}Page Not Found — FixNear{% endblock %}

{% block content %}
<section class="section">
  <div class="shell">
    <div class="empty-state reveal is-visible" style="max-width: 480px; margin: 0 auto;">
      <div class="icon-wrap" style="width: 96px; height: 96px;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      </div>
      <div class="eyebrow" style="justify-content: center;"><span class="dot"></span> 404</div>
      <h3>Page not found</h3>
      <p>The page you're looking for doesn't exist or may have moved.</p>
      <div class="hero-actions" style="justify-content: center;">
        <a href="{{ url_for('home') }}" class="btn btn-accent btn-ripple">Back to Home</a>
        <a href="{{ url_for('find_work') }}" class="btn btn-outline btn-ripple">Find Work</a>
      </div>
    </div>
  </div>
</section>
{% endblock %}
